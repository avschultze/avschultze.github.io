<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="item" content="de694b91f31773e1-a32555">
<title>Bytecode comparison</title>
<style>
:root { color-scheme: light; }
* { box-sizing: border-box; }
body {
  margin: 0; padding: 20px; background: #ffffff; color: #1f2328;
  font: 15px/1.5 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
.wrap { max-width: 960px; margin: 0 auto; }
h1 { font-size: 16px; font-weight: 600; margin: 0 0 4px; }
.cls { font: 13px/1.4 ui-monospace, Consolas, "Courier New", monospace;
       color: #57606a; word-break: break-all; margin: 0 0 14px; }
.definition { background: #f6f8fa; border: 1px solid #d0d7de; border-radius: 6px;
              padding: 10px 12px; font-size: 14px; margin: 0 0 14px; }
.legend { display: flex; flex-wrap: wrap; gap: 16px; font-size: 13px;
          color: #57606a; margin: 0 0 8px; }
/* The sign inside each chip matches the diff's gutter - same font, weight and
   colour - so the legend still reads for anyone who cannot tell red from green. */
.chip { display: inline-flex; align-items: center; justify-content: center;
        width: 16px; height: 16px; border-radius: 3px; vertical-align: -3px;
        margin-right: 6px; border: 1px solid;
        font: 700 13px/1 ui-monospace, Consolas, "Courier New", monospace; }
.chip.del { background: #ffebe9; border-color: #cf222e; color: #cf222e; }
.chip.add { background: #dafbe1; border-color: #1a7f37; color: #1a7f37; }
.diff { border: 1px solid #d0d7de; border-radius: 6px; overflow-x: auto;
        font: 13px/1.55 ui-monospace, Consolas, "Courier New", monospace; }
.diff table { border-collapse: collapse; width: 100%; }
.diff td { padding: 0 12px; white-space: pre-wrap; overflow-wrap: anywhere; vertical-align: top; }
.diff td.sign { width: 1%; padding-right: 4px; color: #57606a; user-select: none; }
.diff tr.del { background: #ffebe9; }
.diff tr.del td.sign { color: #cf222e; font-weight: 700; }
.diff tr.add { background: #dafbe1; }
.diff tr.add td.sign { color: #1a7f37; font-weight: 700; }
.diff tr.hunk td { background: #f6f8fa; color: #8c959f; font-size: 12px;
                   padding-top: 3px; padding-bottom: 3px; }
.empty { padding: 16px; color: #57606a; font-style: italic; }
.assessment { border: 2px solid #0969da; border-radius: 6px; padding: 12px 14px;
              margin: 0 0 16px; background: #f6faff; }
.assessment .by { font-size: 13px; color: #57606a; margin: 0 0 6px; }
.assessment .verdict { font-size: 17px; font-weight: 600; margin: 0 0 6px; }
.assessment .reason { margin: 0; }
.assessment .certainty { margin: 8px 0 0; font-size: 13px; color: #57606a; }
.diff tr.decl td { font-weight: 700; }
/* The explanation page sits in a short iframe of its own: no page heading and
   little padding, so the assessment fits without a scrollbar. */
body.info { padding: 8px 12px; }
body.info .assessment { margin: 0; }
/* Whole-class toggle. CSS only - a checkbox and its label - so the pages stay
   script-free inside the Qualtrics iframe. The compact view is the default. */
.ctx { position: relative; }
.ctx-toggle { position: absolute; opacity: 0; width: 1px; height: 1px; }
.ctx-btn { display: inline-block; margin: 0 0 8px; padding: 5px 12px; font-size: 13px;
           border: 1px solid #d0d7de; border-radius: 6px; background: #f6f8fa;
           color: #1f2328; cursor: pointer; user-select: none; }
.ctx-btn:hover { background: #eaeef2; }
.ctx-toggle:focus-visible + .ctx-btn { outline: 2px solid #0969da; outline-offset: 2px; }
.ctx-btn .less, .ctx .full { display: none; }
.ctx-toggle:checked + .ctx-btn .more, .ctx-toggle:checked ~ .compact { display: none; }
.ctx-toggle:checked + .ctx-btn .less { display: inline; }
.ctx-toggle:checked ~ .full { display: block; }
.ctx-note { font-size: 12px; color: #57606a; margin: 0 0 8px 8px; display: inline-block; }
.jump { font-size: 13px; color: #57606a; margin: 0 0 8px; }
.jump a { color: #0969da; margin-right: 6px; }
.diff tr[id] { scroll-margin-top: 30vh; }   /* land with the method header in view */
.trim-note { background: #fff8c5; border: 1px solid #d4a72c; border-radius: 6px;
             padding: 8px 12px; font-size: 13px; margin: 0 0 8px; }
</style>
</head>
<body class="info">
<div class="wrap">
<div class="assessment"><p class="by">Assessment by a machine learning model</p><p class="verdict">Not behaviourally equivalent</p><p class="reason">Reason: The protected method getRGB was renamed to getRgb, which changes the API seen by subclasses and callers, even though the body is identical.</p></div>
</div>
</body>
</html>
